<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SMM ERP</title>
<style>
:root{
  --bg:#ffffff; --side:#fbfbfa; --text:#37352f; --muted:#6b6a67; --faint:#8a8987;
  --line:#eaeae8; --line2:#e3e2e0; --hover:#f4f4f2; --sel:#eef3fb;
  --accent:#2383e2; --accentbg:#eaf3fc;
  --green:#448361; --greenbg:#e7f3ec; --red:#c0392b; --redbg:#fbeceb; --yellow:#946200; --yellowbg:#faf3e0; --purple:#6940a5; --purplebg:#f0ebf9; --gray:#787774; --graybg:#f1f1ef; --pink:#ad1a72; --pinkbg:#fbeaf3; --orange:#b45309; --orangebg:#fbecdd;
  --shadow:0 1px 2px rgba(15,15,15,.05),0 2px 8px rgba(15,15,15,.04);
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:ui-sans-serif,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--text);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer}
a{color:var(--accent);text-decoration:none}
input,select,textarea{font-family:inherit;font-size:16px;background:#fff;border:1px solid var(--line2);color:var(--text);border-radius:6px;padding:8px 10px;width:100%;transition:border .15s,box-shadow .15s}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 2px var(--accentbg)}
label{display:block;font-size:12px;color:var(--muted);margin:12px 0 5px;font-weight:500}
.app{display:flex;min-height:100vh}
.mobtop{display:none}
.ham{background:none;border:1px solid var(--line2);border-radius:8px;font-size:18px;width:38px;height:38px;line-height:1}
.side{width:236px;background:var(--side);border-right:1px solid var(--line);padding:14px 8px;position:sticky;top:0;height:100vh;overflow:auto;flex-shrink:0;display:flex;flex-direction:column}
.brand{font-weight:700;font-size:15px;padding:6px 10px 14px;display:flex;align-items:center;gap:8px}
.logo{width:22px;height:22px;border-radius:6px;background:var(--text);color:#fff;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800}
.nav{flex:1}
.nav a{display:flex;align-items:center;gap:9px;padding:8px 10px;border-radius:6px;color:var(--gray);font-weight:500;margin-bottom:1px;font-size:14px}
.nav a .ic{width:18px;text-align:center;font-size:15px;opacity:.85}
.nav a:hover{background:var(--hover)}
.nav a.active{background:var(--hover);color:var(--text);font-weight:600}
.nav .sec{font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--faint);padding:14px 10px 5px;font-weight:600}
.usercard{border-top:1px solid var(--line);padding:12px 10px 4px;margin-top:8px}
.usercard .u{display:flex;align-items:center;gap:9px}
.ava{width:30px;height:30px;border-radius:50%;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px}
.main{flex:1;padding:26px 40px;max-width:1240px;margin:0 auto;width:100%}
.topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px;gap:12px;flex-wrap:wrap}
h1{font-size:26px;margin:0;font-weight:700;letter-spacing:-.02em}
h2{font-size:15px;margin:0 0 14px;font-weight:600}
h3{margin:0}
.btn{background:var(--accent);color:#fff;border:1px solid var(--accent);padding:8px 14px;border-radius:6px;font-weight:500;font-size:13px;transition:background .15s}
.btn:hover{background:#1b6fc4}
.btn.sec{background:#fff;border:1px solid var(--line2);color:var(--text)}
.btn.sec:hover{background:var(--hover)}
.btn.sm{padding:5px 10px;font-size:12px}
.btn.danger{background:#fff;border:1px solid var(--line2);color:var(--red)}
.btn.danger:hover{background:var(--redbg)}
.btn.ghost{background:none;border:none;color:var(--muted);padding:5px 8px}
.btn.ghost:hover{background:var(--hover);color:var(--text)}
.btn.block{width:100%;justify-content:center;padding:11px}
.grid{display:grid;gap:14px}
.cards{grid-template-columns:repeat(auto-fill,minmax(240px,1fr))}
.card{background:#fff;border:1px solid var(--line);border-radius:10px;padding:16px;transition:box-shadow .15s,border .15s}
.card.click{cursor:pointer}
.card.click:hover{box-shadow:var(--shadow);border-color:var(--line2)}
.stat .n{font-size:30px;font-weight:700;letter-spacing:-.02em}
.stat .l{color:var(--muted);font-size:13px;margin-top:2px}
.panel{background:#fff;border:1px solid var(--line);border-radius:10px;padding:18px;margin-bottom:16px}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);font-size:14px;vertical-align:middle}
th{color:var(--muted);font-weight:500;font-size:12px}
tbody tr:last-child td{border-bottom:none}
tr:hover td{background:var(--side)}
.rowclick{cursor:pointer}
tfoot td{border-top:2px solid var(--line2);border-bottom:none;font-weight:600}
.chip{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:5px;font-size:12px;font-weight:500;background:var(--graybg);color:var(--gray)}
.chip:before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;opacity:.85}
.chip.plain:before{display:none}
.chip.green{background:var(--greenbg);color:var(--green)}.chip.yellow{background:var(--yellowbg);color:var(--yellow)}.chip.red{background:var(--redbg);color:var(--red)}.chip.blue{background:var(--accentbg);color:var(--accent)}.chip.purple{background:var(--purplebg);color:var(--purple)}.chip.gray{background:var(--graybg);color:var(--gray)}.chip.pink{background:var(--pinkbg);color:var(--pink)}.chip.orange{background:var(--orangebg);color:var(--orange)}
.prog{height:6px;background:var(--line);border-radius:6px;overflow:hidden;min-width:80px}
.prog>i{display:block;height:100%;background:var(--accent);border-radius:6px;transition:width .3s}
.prog>i.full{background:var(--green)}
.pipe{display:flex;align-items:center;gap:0;flex-wrap:wrap;margin:2px 0}
.pipe .st{display:flex;align-items:center;font-size:10.5px;color:var(--faint)}
.pipe .st .d{width:9px;height:9px;border-radius:50%;background:var(--line2);margin-right:3px}
.pipe .st.done .d{background:var(--green)}
.pipe .st.cur .d{background:var(--accent);box-shadow:0 0 0 3px var(--accentbg)}
.pipe .st.cur{color:var(--accent);font-weight:600}
.pipe .st .bar{width:12px;height:2px;background:var(--line2);margin:0 2px}
.pipe .st.done .bar{background:var(--green)}
.metarow{display:flex;gap:22px;flex-wrap:wrap;margin:8px 0 18px}
.metaitem{display:flex;flex-direction:column;gap:5px}
.ml{font-size:10.5px;text-transform:uppercase;letter-spacing:.6px;color:var(--faint);font-weight:700}
.psteps{display:flex;flex-wrap:wrap;gap:5px;margin:2px 0}
.pstep{display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border-radius:20px;font-size:11.5px;font-weight:500;background:var(--graybg);color:var(--muted)}
.pstep .sd{width:8px;height:8px;border-radius:50%;background:var(--faint);flex-shrink:0}
.pstep.done{background:var(--greenbg);color:var(--green)}
.pstep.done .sd{background:var(--green)}
.pstep.cur{background:var(--accent);color:#fff;font-weight:600;box-shadow:0 1px 6px rgba(35,131,226,.35)}
.pstep.cur .sd{background:#fff}
.row{display:flex;gap:12px;flex-wrap:wrap}
.row>*{flex:1;min-width:0}
.muted{color:var(--muted)}
.right{text-align:right}
.small{font-size:12.5px}
.overlay{position:fixed;inset:0;background:rgba(15,15,15,.35);display:none;align-items:flex-start;justify-content:center;padding:44px 16px;z-index:80;overflow:auto;backdrop-filter:blur(1px)}
.overlay.open{display:flex}
.modal{background:#fff;border-radius:12px;width:680px;max-width:100%;padding:24px;box-shadow:0 12px 40px rgba(15,15,15,.18)}
.modal h2{display:flex;justify-content:space-between;align-items:center;font-size:18px}
.x{background:none;border:none;color:var(--muted);font-size:22px;line-height:1;padding:0 4px;border-radius:5px}
.x:hover{background:var(--hover)}
.kanban{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.kcol{background:var(--side);border-radius:10px;padding:8px;transition:background .15s,box-shadow .15s}
.kcol.drag{background:var(--accentbg);box-shadow:inset 0 0 0 2px var(--accent)}
.kcard[draggable]{cursor:grab}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.cal .dow{font-size:11px;text-transform:uppercase;color:var(--faint);font-weight:600;text-align:center;padding:2px}
.cal .cell{min-height:104px;border:1px solid var(--line);border-radius:8px;padding:6px;background:#fff;overflow:hidden}
.cal .cell.out{background:var(--side);opacity:.6}
.cal .cell.today{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.cal .cell.wk{min-height:150px}
.cal .dn{font-size:12px;font-weight:600;margin-bottom:5px;color:var(--muted)}
.cal .ev{font-size:11px;padding:3px 6px;border-radius:5px;margin-bottom:4px;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:500}
@media(max-width:700px){.cal .cell{min-height:70px}.cal .ev{font-size:9px;padding:1px 3px}}
.kcol h3{font-size:12.5px;color:var(--muted);margin:6px 8px 10px;display:flex;justify-content:space-between;font-weight:600}
.kcard{background:#fff;border:1px solid var(--line);border-radius:8px;padding:11px;margin-bottom:8px;font-size:13px;cursor:pointer;transition:box-shadow .15s}
.kcard:hover{box-shadow:var(--shadow)}
.kcard b{font-size:13.5px;font-weight:600}
.kcard .rel{font-size:11.5px;color:var(--accent);background:var(--accentbg);padding:2px 6px;border-radius:5px;display:inline-block;margin-top:6px}
.daynav,.seg{display:inline-flex;background:var(--graybg);padding:3px;border-radius:8px}
.daynav button,.seg button{background:none;border:none;padding:7px 12px;border-radius:6px;font-weight:500;font-size:13px;color:var(--gray)}
.daynav button.active,.seg button.active{background:#fff;color:var(--text);box-shadow:var(--shadow)}
.tag{font-size:12px;padding:1px 7px;border-radius:5px;background:var(--graybg);color:var(--gray);margin-right:4px;display:inline-block;margin-bottom:3px}
.flex{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.flex.nowrap{flex-wrap:nowrap}
.sp{justify-content:space-between}
.money{font-variant-numeric:tabular-nums;font-weight:600}
.pos{color:var(--green)}.neg{color:var(--red)}
.notice{background:var(--accentbg);color:#1a5fa0;padding:11px 14px;border-radius:8px;font-size:13px;margin-bottom:16px;border:1px solid #d3e6f8}
.warn{background:var(--yellowbg);color:#7a5200;border:1px solid #ecd9a3}
.kv td:first-child{color:var(--muted);width:140px;font-size:13px}
.check{display:flex;align-items:center;gap:8px;padding:5px 0;font-size:13.5px}
.dot{width:16px;height:16px;border-radius:5px;display:inline-flex;align-items:center;justify-content:center;font-size:11px;flex-shrink:0}
.dot.on{background:var(--green);color:#fff}.dot.off{background:var(--line2);color:#fff}
input[type=checkbox]{width:auto}
.switch{display:flex;flex-wrap:wrap;gap:8px}
.switch label{display:inline-flex;align-items:center;gap:6px;margin:0;color:var(--text);background:#fff;border:1px solid var(--line2);padding:7px 12px;border-radius:6px;font-weight:500;cursor:pointer}
.hint{font-size:12px;color:var(--muted);margin-top:6px}
.relation{background:var(--side);border:1px solid var(--line2);border-radius:10px;padding:14px 16px;margin-top:10px}
.relation>.rl{font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--faint);font-weight:600;margin-bottom:8px;display:flex;align-items:center;gap:6px}
.relation table td,.relation table th{border-bottom:1px solid var(--line)}
.gridwrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px}
table.att{border-collapse:separate;border-spacing:0;min-width:100%}
table.att th,table.att td{white-space:nowrap;border-bottom:1px solid var(--line);border-right:1px solid var(--line)}
table.att thead th{background:var(--side);position:sticky;top:0;z-index:2;font-weight:600;color:var(--text)}
table.att th:first-child,table.att td:first-child{position:sticky;left:0;background:#fff;z-index:1;font-weight:600;min-width:120px}
table.att thead th:first-child{z-index:3;background:var(--side)}
table.att tr:hover td{background:var(--side)}
table.att td.weekend,table.att th.weekend{background:#faf9f7}
.cell-in{width:78px;padding:4px 6px;text-align:center;font-variant-numeric:tabular-nums;font-size:13px}
.cell-present{border-color:var(--green)!important;box-shadow:0 0 0 1px var(--green)}
.cell-late{border-color:var(--yellow)!important;box-shadow:0 0 0 1px var(--yellow)}
.att-cell{display:flex;align-items:center;gap:5px;justify-content:center}
.metric{display:flex;flex-direction:column;gap:2px;background:var(--side);border:1px solid var(--line);border-radius:8px;padding:12px}
.metric .mv{font-size:20px;font-weight:700}
.owner-head{background:linear-gradient(120deg,#2383e2,#6940a5);color:#fff;border-radius:12px;padding:24px 26px;margin-bottom:18px}
.tarif-row{display:flex;align-items:center;gap:10px;padding:5px 0;border-bottom:1px solid var(--line)}
.tarif-row:last-child{border-bottom:none}
.tarif-row .lb{flex:1;font-size:13px}
.tarif-row input{width:130px;text-align:right}
.backdrop{display:none}
.login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:linear-gradient(160deg,#f4f7fc,#eef1f9)}
.login-card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:30px;width:380px;max-width:100%;box-shadow:0 10px 40px rgba(15,15,15,.08)}
.perm-tbl td,.perm-tbl th{text-align:center}
.perm-tbl td:first-child,.perm-tbl th:first-child{text-align:left}
@media(max-width:860px){
  .mobtop{display:flex;position:sticky;top:0;z-index:40;background:#fff;border-bottom:1px solid var(--line);padding:9px 12px;align-items:center;gap:10px}
  .side{position:fixed;top:0;left:0;z-index:70;transform:translateX(-100%);transition:transform .22s;box-shadow:0 0 50px rgba(0,0,0,.22)}
  .side.open{transform:none}
  .backdrop{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:65}
  .backdrop.open{display:block}
  .main{padding:16px 14px}
  .modal{padding:18px}
  .row>*{min-width:100%}
  .kanban{grid-template-columns:1fr}
  h1{font-size:21px}
  .topbar{margin-bottom:16px}
  .cards{grid-template-columns:1fr 1fr}
}
@media(max-width:520px){.cards{grid-template-columns:1fr}}
@media print{.side,.mobtop,.no-print{display:none!important}.main{padding:0;max-width:100%}.panel{border:none;padding:0}}
</style>
</head>
<body>
<div class="mobtop"><button class="ham" onclick="toggleSide()">☰</button><b style="flex:1">SMM ERP</b><span id="mobuser" class="muted small"></span></div>
<div class="app">
  <aside class="side" id="side">
    <div class="brand"><span class="logo">S</span><span>SMM ERP</span></div>
    <nav class="nav" id="nav"></nav>
    <div class="usercard" id="usercard"></div>
  </aside>
  <main class="main" id="view"></main>
</div>
<div class="backdrop" id="backdrop" onclick="toggleSide()"></div>
<div class="overlay" id="overlay"><div class="modal" id="modal"></div></div>

<script>
/* ============================================================ SMM ERP v5 */
/* ====== GOOGLE SHEETS SERVER SOZLAMASI ======
   Umumiy baza (hamma telefon bir xil ma'lumot) uchun Google Apps Script web-app manzilini qo'ying.
   Yo'riqnoma: JOYLASH_YORIQNOMASI.md (Google Sheets bo'limi). Bo'sh qoldirilsa — local rejim. */
const SHEET_API_URL = 'https://script.google.com/macros/s/AKfycbzV1rrqkYGDuytM7nx_hv7STdjPqSxmCwGvWoI-o_9Y-4ThydgUK2jTiR-HFEiE2cRe/exec';
/* ============================================= */

const LS_KEY='smm_erp_v2';
const CLOUD=!!SHEET_API_URL;
const uid=()=>Math.random().toString(36).slice(2,9);
const money=n=>(Math.round(n)||0).toLocaleString('ru-RU');
const pad=n=>String(n).padStart(2,'0');
const iso=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const todayStr=()=>iso(new Date());
const curMonth=()=>todayStr().slice(0,7);
const nowTime=()=>{const d=new Date();return pad(d.getHours())+':'+pad(d.getMinutes());};
const fmtDate=d=>d?d.split('-').reverse().join('.'):'—';
const MONTHS=['Yanvar','Fevral','Mart','Aprel','May','Iyun','Iyul','Avgust','Sentabr','Oktabr','Noyabr','Dekabr'];
const fmtMonth=m=>{const[y,mm]=m.split('-');return MONTHS[+mm-1]+' '+y;};
const esc=s=>(s||'').replace(/"/g,'&quot;').replace(/</g,'&lt;');
function shiftDate(base,delta){const d=new Date(base);d.setDate(d.getDate()+delta);return iso(d);}
function weekdayOf(dstr){return new Date(dstr).getDay();}

const ROLES={admin:'Admin',smm:'SMM menejer',mobilograf:'Mobilograf',owner:'Loyiha egasi'};
const STATUSES=['G‘oya','Tasdiqlangan','Ssenariy','Syomka','Montaj','Tekshiruv','Tayyor','Rejalashtirilgan','Chop etilgan'];
const STC={'G‘oya':'gray','Tasdiqlangan':'blue','Ssenariy':'blue','Syomka':'yellow','Montaj':'yellow','Tekshiruv':'purple','Tayyor':'green','Rejalashtirilgan':'blue','Chop etilgan':'green'};
const TASK_STATUS=['Yangi','Jarayonda','Tekshiruvda','Tasdiqlandi'];
const TSC={'Yangi':'gray','Jarayonda':'blue','Tekshiruvda':'yellow','Tasdiqlandi':'green'};
const PARTS=['Ssenariy','Syomka','Montaj','Dizayn','Joylash','Boshqa'];
const PLATFORMS=['Instagram','Telegram','TikTok','YouTube','Facebook'];
const KPI_CRIT=[
  {key:'montajOnTime',label:'Montaj muddati',desc:'«Montaj» vazifasi o‘z vaqtida topshirilgan'},
  {key:'syomkaOnTime',label:'Syomka jadval bo‘yicha',desc:'«Syomka» vazifasi o‘z vaqtida'},
  {key:'lowRework',label:'Qayta ishlash (qaytarilmadi)',desc:'Biror vazifa qaytarilmagan'},
  {key:'archiveSaved',label:'Arxiv va material tartibi',desc:'Drive havolasi kiritilgan'},
];
const PEN_TARIFF=[
  {key:'late1560',label:'15–60 daq kechikish (3-martadan)',note:'1-marta yozma, 2-marta hayfsan'},
  {key:'late60_2',label:'60+ daq kechikish — 2-marta',note:'1-marta hayfsan'},
  {key:'late60_3',label:'60+ daq kechikish — 3-martadan',note:''},
  {key:'shootAbsent1',label:'Syomka kunida kelmadi — 1-marta',note:'Eng og‘ir holat'},
  {key:'shootAbsent2',label:'Syomka kunida kelmadi — 2-marta',note:''},
  {key:'unexcused1',label:'Sababsiz 1 kun — 1-marta',note:''},
  {key:'unexcused2',label:'Sababsiz 1 kun — 2-marta',note:''},
];
const BON_TARIFF=[
  {key:'discipline',label:'Intizom bonusi',note:'0 kechikish, 0 sababsiz — avtomatik',auto:true},
  {key:'stability',label:'Barqarorlik bonusi (3 oy KPI 90%+)',note:''},
  {key:'clientPraise',label:'Mijoz maqtovi',note:'Yozma minnatdorchilik'},
  {key:'newClient',label:'Yangi mijoz olib keldi',note:'Mijoz 1-oyni to‘lagandan keyin'},
  {key:'viralReels',label:'Reels 100K+ ko‘rish',note:'30 kun ichida organik'},
];
const WEEKDAYS=[{d:1,l:'Du'},{d:2,l:'Se'},{d:3,l:'Cho'},{d:4,l:'Pa'},{d:5,l:'Ju'},{d:6,l:'Sha'},{d:0,l:'Yak'}];
const PAGE_LABELS={dash:'Dashboard',content:'Kontent reja',tasks:'Vazifalar',attend:'Davomat',salary:'KPI/Oylik',reports:'Hisobot',employees:'Foydalanuvchilar',projects:'Loyihalar',settings:'Sozlamalar'};

/* ---------- Store ---------- */
let DB,currentUser=null;
function mkTask(part,ass,by,dl,createdAt,checklist,platform){return {id:uid(),title:platform?part+' — '+platform:part,part,platform:platform||'',assigneeId:ass,createdBy:by,createdAt:createdAt||todayStr(),deadline:dl,status:'Yangi',link:'',doneAt:'',reworkCount:0,checklist:(checklist||[]).map(x=>({text:x,done:false}))};}
function defPerms(){return {smm:['dash','content','tasks','reports','projects'],mobilograf:['dash','tasks','content'],owner:[]};}
function seed(){
  const e1=uid(),e2=uid(),e3=uid(),e4=uid(),e5=uid(),p1=uid(),p2=uid();
  const T=todayStr(),y=shiftDate(T,-1),tm=shiftDate(T,2);
  const defRub=['Mahsulot','Ta‘limiy','Ko‘ngilochar','Keys','Trend'];
  const defChk=['Ssenariy tayyor','Yorug‘lik/ovoz tekshirildi','Montaj qilindi','Rahbariyat tasdiqladi'];
  const t1=mkTask('Syomka',e3,e2,y,y);t1.status='Tasdiqlandi';t1.doneAt=y;t1.link='https://drive/syomka';
  const t2=mkTask('Montaj',e4,e2,T,y);
  return {
    schema:2,

/* ---------- Storage (Google Sheets yoki localStorage) ---------- */
function validDB(j){return j&&j.schema&&Array.isArray(j.employees)&&j.settings&&Array.isArray(j.projects);}
function localDB(){try{const d=JSON.parse(localStorage.getItem(LS_KEY));return validDB(d)?d:null;}catch(_){return null;}}
function stable(db){if(!db)return '';const c={};for(const k in db)if(k!=='__v'&&k!=='updatedAt')c[k]=db[k];return JSON.stringify(c);} // versiya/vaqtsiz taqqoslash
let sizeWarned=false;
async function pull(){
  if(CLOUD){
    try{const r=await fetch(SHEET_API_URL,{method:'GET'});const txt=await r.text();
      let j=null;try{j=JSON.parse(txt);}catch(_){}
      if(j&&j.db&&validDB(j.db))j=j.db;                              // v2 backend {db,...} bo'lsa ham qo'llab-quvvatlaymiz
      if(validDB(j)){DB=j;cloudVersion=(j.__v!=null)?j.__v:null;}
      else{
        const empty=(!txt)||txt.trim()===''||txt.trim()==='{}'||txt.trim()==='[]';
        const lb=localDB();
        if(empty&&!lb){DB=seed();await pushNow();}                 // haqiqiy birinchi ishga tushirish — seed yaratamiz
        else if(lb){DB=lb;cloudRisky=!empty;                        // buzuq o'qish — mahalliy nusxa, cloudga YOZMAYMIZ
          if(!empty)setTimeout(()=>{try{alert('⚠️ Bulutdagi ma\'lumotni o\'qib bo\'lmadi. Vaqtincha mahalliy nusxa ko\'rsatilyapti. Saqlashdan oldin admin bilan tekshiring — eski ma\'lumotni buzib qo\'ymaslik uchun bulutga yozilmaydi.');}catch(_){}} ,400);}
        else{DB=seed();cloudRisky=!empty;}                          // na cloud, na local — seed (buzuq bo'lsa yozmaydi)
      }}
    catch(e){console.warn('Bulutga ulanib bo‘lmadi, local nusxa ishlatiladi (offline yoki preview).');DB=localDB()||seed();cloudRisky=true;}
  }else{DB=localDB()||seed();}
  migrate();
}
let saveTimer=null,lastPush='',cloudVersion=null,cloudRisky=false,pushing=false;
function save(){localStorage.setItem(LS_KEY,JSON.stringify(DB));if(CLOUD){clearTimeout(saveTimer);saveTimer=setTimeout(async()=>{await pushNow();saveTimer=null;},600);}}
async function pushNow(){if(!CLOUD)return;
  if(cloudRisky){console.warn('Buzuq o‘qish aniqlangan — bulutga yozish to‘xtatildi (eski ma‘lumotni buzmaslik uchun).');return;}
  pushing=true;
  try{
    DB.updatedAt=new Date().toISOString();
    DB.__v=(cloudVersion==null?0:cloudVersion);                     // biz asoslangan versiya (optimistik konkurentlik)
    const body=JSON.stringify(DB);lastPush=stable(DB);
    if(body.length>45000&&!sizeWarned){sizeWarned=true;             // 50k bitta-katak limitiga yaqin
      try{alert('⚠️ Baza hajmi '+Math.round(body.length/1024)+' KB — Google Sheets bitta katak limiti (50 KB) ga yaqinlashdi. «Backend v2» (alohida listlar) ga o‘tish tavsiya etiladi (JOYLASH_YORIQNOMASI.md).');}catch(_){}}
    const r=await fetch(SHEET_API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body});
    let res=null;try{res=JSON.parse(await r.text());}catch(_){}
    if(res&&res.conflict&&res.db&&validDB(res.db)){                 // v2 server: eski versiya rad etildi — birlashtiramiz
      DB=mergeDB(res.db,DB);cloudVersion=(res.v!=null?res.v:cloudVersion);DB.__v=cloudVersion;save();}
    else if(res&&res.ok){cloudVersion=(res.v!=null?res.v:(cloudVersion==null?0:cloudVersion)+1);DB.__v=cloudVersion;}
    else if(!r.ok){console.warn('Saqlash server xatosi: HTTP '+r.status);}
  }catch(e){console.warn('Saqlashda bulutga ulanib bo‘lmadi (offline/preview) — keyin qayta urinadi.');}
  pushing=false;
}
/* Konflikt paytida oddiy birlashtirish: id bo'yicha, mahalliy o'zgarishlarни ustun qo'yadi lekin serverdagi yangi yozuvlarni yo'qotmaydi */
function mergeDB(server,localD){
  const out=JSON.parse(JSON.stringify(server));
  ['employees','projects','contents','attendance','adjustments'].forEach(k=>{
    const sArr=out[k]||[],lArr=localD[k]||[];const byId={};sArr.forEach(x=>byId[x.id]=x);
    lArr.forEach(x=>{byId[x.id]=x;});                               // mahalliy yozuv serverникini ustidan yozadi
    out[k]=Object.values(byId);
  });
  out.settings=localD.settings||out.settings;
  return out;
}

  try{const r=await fetch(SHEET_API_URL,{method:'GET'});const txt=await r.text();let j=null;try{j=JSON.parse(txt);}catch(_){}
    if(saveTimer||pushing)return;                                   // fetch paytida tahrir bo'ldi
    if(j&&j.db&&validDB(j.db))j=j.db;
    if(validDB(j)){cloudRisky=false;if(j.__v!=null)cloudVersion=j.__v;const s=stable(j);
      if(s!==stable(DB)&&s!==lastPush){const openId=document.getElementById('overlay').classList.contains('open');DB=j;migrate();if(!openId)refresh();}}}catch(e){}
},10000);}

function taskByPart(c,part){return c.tasks.find(t=>t.part===part);}
function onTime(t){return t&&t.doneAt&&t.deadline&&t.doneAt<=t.deadline;}
const PART_STAGE={Ssenariy:'Ssenariy',Syomka:'Syomka',Montaj:'Montaj',Dizayn:'Montaj',Joylash:'Tayyor'};
function chainForFormat(fmt){const video=/reels|video|youtube|tiktok|montaj|klip/i.test(fmt||'');
  return video?['Ssenariy','Syomka','Montaj','Joylash']:['Dizayn','Joylash'];}
function assignForPart(part,d,p){                                   // rolga qarab biriktiradi (keyin qo'lda tahrirlash mumkin)
  const team=((p&&p.team)||[]).map(id=>emp(id)).filter(Boolean);
  const mob=team.find(e=>e.role==='mobilograf');
  if((part==='Syomka'||part==='Montaj')&&mob)return mob.id;        // syomka/montaj — mobilografga
  return d.responsibleId||(team[0]&&team[0].id)||'';}              // ssenariy/dizayn/joylash — mas'ul
function approverOf(t){                                            // tasdiqlovchi: vazifani yaratgan; agar u bajaruvchining o'zi bo'lsa — admin
  if(t.createdBy&&t.createdBy!==t.assigneeId)return t.createdBy;
  const a=DB.employees.find(e=>e.role==='admin');return a?a.id:'';}
function canApprove(t){return currentUser.id!==t.assigneeId&&(currentUser.role==='admin'||currentUser.id===approverOf(t));}
function deriveContentStatus(c){
  if(c.platforms&&c.platforms.length&&c.platforms.every(pf=>c.published&&c.published[pf]))return 'Chop etilgan';
  let best=-1;(c.tasks||[]).forEach(t=>{if(t.status==='Tasdiqlandi'){const i=STATUSES.indexOf(PART_STAGE[t.part]||'');if(i>best)best=i;}});
  return best<0?c.status:STATUSES[best];
}
function computeKpi(c){return {montajOnTime:!!onTime(taskByPart(c,'Montaj')),syomkaOnTime:!!onTime(taskByPart(c,'Syomka')),lowRework:c.tasks.every(t=>(t.reworkCount||0)===0)&&(c.status==='Chop etilgan'||c.status==='Tayyor'),archiveSaved:!!c.drive};}
function kpiPercent(c){const k=computeKpi(c),w=DB.settings.kpiWeights;return KPI_CRIT.reduce((s,cr)=>s+(k[cr.key]?(w[cr.key]||0):0),0);}
function contentProgress(c){if(c.status==='Chop etilgan')return 100;if(!c.tasks||!c.tasks.length){const i=STATUSES.indexOf(c.status);return Math.round(i/(STATUSES.length-1)*90);}const done=c.tasks.filter(t=>t.status==='Tasdiqlandi').length;return Math.min(Math.round(done/c.tasks.length*100),99);}
function pipeline(c){const idx=STATUSES.indexOf(c.status);return `<div class="pipe">${STATUSES.map((s,i)=>`<div class="st ${i<idx?'done':''} ${i===idx?'cur':''}" title="${s}"><span class="d"></span>${i===idx?s:''}${i<STATUSES.length-1?'<span class="bar"></span>':''}</div>`).join('')}</div>`;}
function pipelineFull(c){const idx=STATUSES.indexOf(c.status);return `<div class="psteps">${STATUSES.map((s,i)=>`<span class="pstep ${i<idx?'done':''} ${i===idx?'cur':''}"><span class="sd"></span>${s}</span>`).join('')}</div>`;}
function allTasks(){return DB.contents.flatMap(c=>c.tasks.map(t=>({...t,content:c})));}
function projectKpiPct(p,month){const cs=DB.contents.filter(c=>c.projectId===p.id&&c.status==='Chop etilgan'&&(c.scheduled||'').slice(0,7)===month);if(!cs.length)return 0;return Math.round(cs.reduce((a,c)=>a+kpiPercent(c),0)/cs.length);}

/* ============================================================ DASHBOARD */

  const t=todayStr(),tasks=allTasks();

  const lateT=mine.filter(x=>x.deadline&&x.deadline<t&&x.status!=='Tasdiqlandi');
  const ready=DB.contents.filter(c=>contentProgress(c)===100).length;
  const inWork=DB.contents.filter(c=>c.status!=='Chop etilgan'&&c.status!=='G‘oya').length;

  ${!CLOUD?'<div class="notice warn">⚠️ Hozir <b>local rejim</b> (bu qurilmada saqlanadi). Hamma bir xil ma\'lumotni ko\'rishi uchun Google Sheets ulang — JOYLASH_YORIQNOMASI.md ga qarang.</div>':''}

    <div class="card stat"><div class="n">${inWork}</div><div class="l">Ishlab chiqarishda</div></div>

  </div>

    <div class="panel"><h2 style="color:var(--red)">Kechikkan vazifalar</h2>${lateT.length?tblT(lateT):'<div class="muted small">Kechikkan vazifa yo‘q 👍</div>'}</div>

function tblT(list){return `<table><thead><tr><th>Vazifa</th><th>Xodim</th><th>Kontent</th><th>Deadline</th></tr></thead><tbody>${list.map(t=>`<tr class="rowclick" onclick="viewTask('${t.id}')"><td>${t.title}</td><td>${emp(t.assigneeId)?.name||'—'}</td><td class="muted small">${t.content.topic}</td><td>${fmtDate(t.deadline)}</td></tr>`).join('')}</tbody></table>`;}

/* ============================================================ KONTENT */
let cFilter='all',cView='table';
function pageContent(){
  const opts=['<option value="all">Barcha loyihalar</option>'].concat(DB.projects.map(p=>`<option value="${p.id}" ${cFilter===p.id?'selected':''}>${p.name}</option>`)).join('');
  let list=DB.contents.slice();if(cFilter!=='all')list=list.filter(c=>c.projectId===cFilter);
  const canEdit=currentUser.role==='admin'||currentUser.role==='smm';
  view(`<div class="topbar"><h1>Kontent reja</h1>
    <div class="flex"><div class="seg"><button class="${cView==='table'?'active':''}" onclick="cView='table';pageContent()">Jadval</button><button class="${cView==='cards'?'active':''}" onclick="cView='cards';pageContent()">Kartochka</button><button class="${cView==='calendar'?'active':''}" onclick="cView='calendar';pageContent()">Kalendar</button></div>
    ${cView!=='cards'?`<button class="btn sec sm" onclick="propsMenu()">👁 Xossalar</button>`:''}
    <select style="width:auto" onchange="cFilter=this.value;pageContent()">${opts}</select>
    ${canEdit?`<button class="btn" onclick="editContent()">+ Yangi</button>`:''}</div></div>
  ${cView==='cards'?contentCards(list):cView==='calendar'?contentCalendar(list):contentTable(list)}`);
}
let calMode='month',calDate=todayStr();
function calShift(delta){const d=new Date(calDate);if(calMode==='month')d.setMonth(d.getMonth()+delta);else d.setDate(d.getDate()+delta*7);calDate=iso(d);pageContent();}
function contentCalendar(list){
  const byDate={};list.forEach(c=>{if(c.scheduled){(byDate[c.scheduled]=byDate[c.scheduled]||[]).push(c);}});
  const anchor=new Date(calDate),y=anchor.getFullYear(),m=anchor.getMonth();
  const dows=['Du','Se','Cho','Pa','Ju','Sha','Yak'];
  let cells,label;
  if(calMode==='month'){
    const first=new Date(y,m,1),off=(first.getDay()+6)%7,start=new Date(y,m,1-off);
    cells=[];for(let i=0;i<42;i++){const d=new Date(start);d.setDate(start.getDate()+i);cells.push({d,out:d.getMonth()!==m});}
    label=MONTHS[m]+' '+y;
  }else{
    const a=new Date(calDate),off=(a.getDay()+6)%7,start=new Date(a);start.setDate(a.getDate()-off);
    cells=[];for(let i=0;i<7;i++){const d=new Date(start);d.setDate(start.getDate()+i);cells.push({d,out:false,wk:true});}
    label=fmtDate(iso(start))+' — '+fmtDate(iso(cells[6].d))+' (hafta)';
  }
  const maxEv=calMode==='week'?8:3;
  const evHtml=c=>{const extra=[];if(cProps.format)extra.push(esc(c.format));if(cProps.responsible&&emp(c.responsibleId))extra.push(esc(emp(c.responsibleId).name));
    return `<div class="ev chip ${STC[c.status]} plain" onclick="viewContent('${c.id}')" title="${esc(c.topic)} · ${c.status}${cProps.responsible&&emp(c.responsibleId)?' · '+esc(emp(c.responsibleId).name):''}">${esc(c.topic)}${extra.length?' <span style="opacity:.7">· '+extra.join(' · ')+'</span>':''}</div>`;};
  const cell=x=>{const ds=iso(x.d),evs=byDate[ds]||[];const today=ds===todayStr();const shown=evs.slice(0,maxEv),extra=evs.length-shown.length;
    return `<div class="cell ${x.out?'out':''} ${today?'today':''} ${x.wk?'wk':''}"><div class="dn">${x.d.getDate()}</div>${shown.map(evHtml).join('')}${extra>0?`<div class="ev chip gray plain" onclick="calMode='week';calDate='${ds}';pageContent()" style="text-align:center">+${extra} yana</div>`:''}</div>`;};
  return `<div class="flex sp" style="margin-bottom:12px;flex-wrap:wrap;gap:10px">
    <div class="flex"><button class="btn sec sm" onclick="calShift(-1)">‹</button><b style="min-width:150px;text-align:center">${label}</b><button class="btn sec sm" onclick="calShift(1)">›</button><button class="btn ghost sm" onclick="calDate='${todayStr()}';pageContent()">Bugun</button></div>
    <div class="seg"><button class="${calMode==='month'?'active':''}" onclick="calMode='month';pageContent()">Oy</button><button class="${calMode==='week'?'active':''}" onclick="calMode='week';pageContent()">Hafta</button></div>
  </div>
  <div class="cal">${dows.map(d=>`<div class="dow">${d}</div>`).join('')}${cells.map(cell).join('')}</div>
  <div class="hint" style="margin-top:8px">Kontentlar «Chop sanasi» bo‘yicha joylashadi. Ustiga bosib ochiladi.</div>`;
}
function contentCards(list){return `<div class="grid cards">${list.map(c=>{const pr=contentProgress(c),done=c.tasks.filter(t=>t.status==='Tasdiqlandi').length;
  return `<div class="card click" onclick="viewContent('${c.id}')">
    <div class="flex sp" style="margin-bottom:9px"><span class="chip ${STC[c.status]}">${c.status}</span><span class="tag">${c.format}</span></div>
    <b style="font-size:15px">${esc(c.topic)||'(nomsiz)'}</b>
    <div class="muted small" style="margin:5px 0 12px">${proj(c.projectId)?.name||''} · ${c.rubric}</div>
    ${pipeline(c)}
    <div class="flex sp small" style="margin:12px 0 5px"><span class="muted">Progress</span><span style="font-weight:600;color:${pr===100?'var(--green)':'var(--accent)'}">${pr}%</span></div>
    <div class="prog"><i class="${pr===100?'full':''}" style="width:${pr}%"></i></div>
    <div class="flex sp" style="margin-top:11px"><div>${c.platforms.map(p=>`<span class="tag">${p}</span>`).join('')}</div><span class="chip ${done===c.tasks.length&&c.tasks.length?'green':'gray'} plain">✅ ${done}/${c.tasks.length}</span></div>
    <div class="muted small" style="margin-top:9px">📅 ${fmtDate(c.scheduled)}</div>
  </div>`;}).join('')||'<div class="muted">Kontent yo‘q.</div>'}</div>`;}
const PROP_DEFS=[{k:'rubric',l:'Rubrika'},{k:'format',l:'Format'},{k:'status',l:'Holat'},{k:'progress',l:'Progress'},{k:'tasks',l:'Vazifa'},{k:'scheduled',l:'Chop sana'},{k:'responsible',l:'Mas\'ul'},{k:'platforms',l:'Platformalar'},{k:'goal',l:'Maqsad'}];
let cProps={rubric:true,format:true,status:true,progress:true,tasks:true,scheduled:true,responsible:false,platforms:false,goal:false};
function propsMenu(){openModal(`<h2>👁 Xossalar (property) <button class="x" onclick="closeModal()">×</button></h2>
  <div class="hint" style="margin-top:2px">Qaysi xossalar ko‘rinsin — Notion kabi tanlang. Jadval va Kalendarga ta'sir qiladi.</div>
  <div class="switch" style="margin-top:10px">${PROP_DEFS.map(p=>`<label><input type="checkbox" ${cProps[p.k]?'checked':''} onchange="cProps['${p.k}']=this.checked"> ${p.l}</label>`).join('')}</div>
  <div class="row" style="margin-top:16px"><button class="btn" onclick="closeModal();pageContent()">Qo‘llash</button></div>`);}
function cCell(c,k){const pr=contentProgress(c),done=(c.tasks||[]).filter(t=>t.status==='Tasdiqlandi').length;
  switch(k){case 'rubric':return esc(c.rubric)||'—';
    case 'format':return `<span class="tag">${esc(c.format)}</span>`;
    case 'status':return `<span class="chip ${STC[c.status]}">${c.status}</span>`;
    case 'progress':return `<div class="flex nowrap" style="gap:8px"><div class="prog" style="flex:1"><i class="${pr===100?'full':''}" style="width:${pr}%"></i></div><span class="small muted">${pr}%</span></div>`;
    case 'tasks':return `${done}/${(c.tasks||[]).length}`;
    case 'scheduled':return fmtDate(c.scheduled);
    case 'responsible':return esc((emp(c.responsibleId)||{}).name||'—');
    case 'platforms':return (c.platforms||[]).map(p=>`<span class="tag">${p}</span>`).join('')||'—';
    case 'goal':return esc(c.goal)||'—';
    default:return '';}}
function contentTable(list){const cols=PROP_DEFS.filter(p=>cProps[p.k]);
  return `<div class="panel gridwrap"><table><thead><tr><th>Mavzu</th><th>Loyiha</th>${cols.map(c=>`<th${c.k==='progress'?' style="width:150px"':''}>${c.l}</th>`).join('')}</tr></thead><tbody>
  ${list.map(c=>`<tr class="rowclick" onclick="viewContent('${c.id}')"><td><b>${esc(c.topic)||'(nomsiz)'}</b></td><td>${proj(c.projectId)?.name||'—'}</td>${cols.map(col=>`<td>${cCell(c,col.k)}</td>`).join('')}</tr>`).join('')||`<tr><td colspan="${cols.length+2}" class="muted">Kontent yo‘q.</td></tr>`}
</tbody></table></div>`;}
function viewContent(id){
  const c=DB.contents.find(x=>x.id===id);if(!c)return;
  const pr=contentProgress(c),kp=computeKpi(c),kpr=kpiPercent(c),w=DB.settings.kpiWeights;
  const canEdit=currentUser.role==='admin'||currentUser.role==='smm';
  openModal(`<h2>${esc(c.topic)||'Kontent'} <button class="x" onclick="closeModal()">×</button></h2>
    <div class="metarow">
      <div class="metaitem"><span class="ml">Holat</span><span class="chip ${STC[c.status]}">${c.status}</span></div>
      <div class="metaitem"><span class="ml">Format</span><span class="chip blue plain">${c.format}</span></div>
      <div class="metaitem"><span class="ml">Rubrika</span><span class="chip purple plain">${c.rubric}</span></div>
      <div class="metaitem"><span class="ml">Loyiha</span><span class="chip gray plain">${proj(c.projectId)?.name||'—'}</span></div>
    </div>
    <div class="ml" style="margin-bottom:7px">Ishlab chiqarish bosqichlari</div>
    ${pipelineFull(c)}
    <div class="flex sp small" style="margin:14px 0 4px"><span class="muted">Umumiy progress</span><span style="font-weight:600;color:${pr===100?'var(--green)':'var(--accent)'}">${pr}%</span></div>
    <div class="prog" style="margin-bottom:16px"><i class="${pr===100?'full':''}" style="width:${pr}%"></i></div>
    <table class="kv"><tbody>
      <tr><td>Maqsad</td><td>${esc(c.goal)||'—'}</td></tr>
      <tr><td>HOOK</td><td>${esc(c.hook)||'—'}</td></tr>
      <tr><td>CTA</td><td>${esc(c.cta)||'—'}</td></tr>
      <tr><td>Mas'ul</td><td>${emp(c.responsibleId)?.name||'—'}</td></tr>
      <tr><td>Chop / Deadline</td><td>${fmtDate(c.scheduled)} / ${fmtDate(c.deadline)}</td></tr>
      <tr><td>Platformalar</td><td>${c.platforms.map(p=>`<span class="tag">${p}${c.published&&c.published[p]?' ✅':''}</span>`).join('')||'—'}</td></tr>
      <tr><td>Referens / Drive</td><td>${c.references?`<a href="${c.references}" target="_blank">referens</a>`:'—'} · ${c.drive?`<a href="${c.drive}" target="_blank">drive</a>`:'<span class="muted">yo‘q</span>'}</td></tr>
    </tbody></table>
    <div class="relation"><div class="rl">🔗 Bog‘liq vazifalar (${c.tasks.length})</div>
      <div class="gridwrap"><table><thead><tr><th>Vazifa</th><th>Bajaruvchi</th><th>Deadline</th><th>Status</th><th>Link</th>${canEdit?'<th></th>':''}</tr></thead><tbody>
      ${c.tasks.map(t=>`<tr class="rowclick" onclick="viewTask('${t.id}')"><td><b>${t.title}</b>${t.reworkCount?` <span class="chip red plain">↩${t.reworkCount}</span>`:''}${t.checklist&&t.checklist.length?` <span class="muted small">☑${t.checklist.filter(x=>x.done).length}/${t.checklist.length}</span>`:''}</td><td>${emp(t.assigneeId)?.name||'—'}</td><td>${fmtDate(t.deadline)} ${onTime(t)?'<span class="chip green plain">vaqtida</span>':(t.doneAt&&t.deadline&&t.doneAt>t.deadline?'<span class="chip red plain">kech</span>':'')}</td><td><span class="chip ${TSC[t.status]}">${t.status}</span></td><td>${t.link?`<a href="${t.link}" target="_blank" onclick="event.stopPropagation()">🔗</a>`:'—'}</td>${canEdit?`<td><button class="x" onclick="event.stopPropagation();delTask('${c.id}','${t.id}')">×</button></td>`:''}</tr>`).join('')||'<tr><td colspan="6" class="muted small">Vazifa yo‘q</td></tr>'}
      </tbody></table></div>
      ${canEdit?`<button class="btn sm sec" style="margin-top:10px" onclick="addTask('${c.id}')">+ Vazifa qo‘shish</button>`:''}
    </div>
    <h2 style="margin-top:18px" class="flex sp">KPI mezonlari <span class="chip ${kpr>=80?'green':kpr>=50?'yellow':'gray'}">${kpr}%</span></h2>
    ${KPI_CRIT.map(cr=>`<div class="check"><span class="dot ${kp[cr.key]?'on':'off'}">${kp[cr.key]?'✓':''}</span><div><span>${cr.label}</span> <span class="muted small">(${w[cr.key]||0}%)</span></div></div>`).join('')}
    ${canEdit?`<div class="row" style="margin-top:18px"><button class="btn sec" onclick="editContent('${c.id}')">Tahrirlash</button><button class="btn danger" onclick="delContent('${c.id}')">O‘chirish</button></div>`:''}`);
}
function delTask(cid,tid){const c=DB.contents.find(x=>x.id===cid);c.tasks=c.tasks.filter(t=>t.id!==tid);save();viewContent(cid);}
function delContent(id){if(!confirm('Kontent o‘chirilsinmi?'))return;DB.contents=DB.contents.filter(c=>c.id!==id);save();closeModal();pageContent();}
function addTask(cid){const c=DB.contents.find(x=>x.id===cid);
  openModal(`<h2>Yangi vazifa <button class="x" onclick="viewContent('${cid}')">×</button></h2>
    <div class="hint" style="margin-top:2px">Kontent: <b>${esc(c.topic)}</b> · Checklist loyiha shablonidan olinadi.</div>
    <label>Vazifa turi</label><select id="t_part">${PARTS.map(p=>`<option>${p}</option>`).join('')}</select>
    <div class="row"><div><label>Bajaruvchi</label><select id="t_ass">${staffOpts()}</select></div><div><label>Kim beryapti</label><select id="t_by">${assignerOpts(currentUser.id)}</select></div></div>
    <label>Deadline</label><input id="t_dl" type="date" value="${todayStr()}">
    <div class="row" style="margin-top:16px"><button class="btn" onclick="saveTask('${cid}')">Qo‘shish</button><button class="btn sec" onclick="viewContent('${cid}')">Bekor</button></div>`);}
function saveTask(cid){const c=DB.contents.find(x=>x.id===cid);const p=proj(c.projectId);c.tasks.push(mkTask(v('t_part'),v('t_ass'),v('t_by'),v('t_dl'),todayStr(),(p&&p.checklist)||[]));save();viewContent(cid);}
function rubricOptions(pid,sel){const p=proj(pid);const rs=(p&&p.rubrics&&p.rubrics.length)?p.rubrics:['(rubrika yo‘q)'];return rs.map(r=>`<option ${sel===r?'selected':''}>${r}</option>`).join('');}
function refreshRubric(){document.getElementById('c_rub').innerHTML=rubricOptions(v('c_proj'));}
function editContent(id){
  const c=id?DB.contents.find(x=>x.id===id):null;
  const curPid=c?c.projectId:(DB.projects[0]&&DB.projects[0].id);
  const pO=DB.projects.map(p=>`<option value="${p.id}" ${curPid===p.id?'selected':''}>${p.name}</option>`).join('');
  const fO=DB.settings.formats.map(f=>`<option ${c&&c.format===f?'selected':''}>${f}</option>`).join('');
  const sO=STATUSES.map(s=>`<option ${c&&c.status===s?'selected':''}>${s}</option>`).join('');
  openModal(`<h2>${c?'Kontentni tahrirlash':'Yangi kontent'} <button class="x" onclick="${c?`viewContent('${id}')`:'closeModal()'}">×</button></h2>
    <div class="row"><div><label>Loyiha</label><select id="c_proj" onchange="refreshRubric()">${pO}</select></div><div><label>Rubrika (loyihadan)</label><select id="c_rub">${rubricOptions(curPid,c?c.rubric:null)}</select></div></div>
    <label>Kontent mavzusi</label><input id="c_topic" value="${c?esc(c.topic):''}" placeholder="Mavzu">
    <div class="row"><div><label>Maqsad</label><input id="c_goal" value="${c?esc(c.goal):''}"></div><div><label>Format</label><select id="c_fmt">${fO}</select></div></div>
    <div class="row"><div><label>HOOK</label><input id="c_hook" value="${c?esc(c.hook):''}"></div><div><label>CTA</label><input id="c_cta" value="${c?esc(c.cta):''}"></div></div>
    <div class="row"><div><label>Holat</label><select id="c_status">${sO}</select></div><div><label>Mas'ul xodim</label><select id="c_resp">${staffOpts(c?c.responsibleId:null)}</select></div></div>
    <div class="row"><div><label>Chop sanasi</label><input id="c_sched" type="date" value="${c?c.scheduled:todayStr()}"></div><div><label>Deadline</label><input id="c_dl" type="date" value="${c?c.deadline:todayStr()}"></div></div>
    <label>Platformalar</label><div class="switch">${PLATFORMS.map(p=>`<label><input type="checkbox" class="c_pf" value="${p}" ${c&&c.platforms.includes(p)?'checked':''}> ${p}</label>`).join('')}</div>
    <div class="row"><div><label>Referens havola</label><input id="c_ref" value="${c?esc(c.references):''}"></div><div><label>Drive (fayllar)</label><input id="c_drive" value="${c?esc(c.drive):''}"></div></div>
    ${c?'':'<div class="hint">Format bo‘yicha to‘liq vazifa zanjiri avtomatik yaratiladi (video: Ssenariy→Syomka→Montaj→Joylash; boshqa: Dizayn→Joylash). Har platformaga alohida «Joylash». Ortiqcha vazifani keyin o‘chirishingiz mumkin.</div>'}
    <div class="row" style="margin-top:16px"><button class="btn" onclick="saveContent('${id||''}')">Saqlash</button><button class="btn sec" onclick="${c?`viewContent('${id}')`:'closeModal()'}">Bekor</button></div>`);}
function saveContent(id){
  const platforms=[...document.querySelectorAll('.c_pf:checked')].map(x=>x.value);
  const d={projectId:v('c_proj'),rubric:v('c_rub'),topic:v('c_topic'),goal:v('c_goal'),format:v('c_fmt'),hook:v('c_hook'),cta:v('c_cta'),status:v('c_status'),responsibleId:v('c_resp'),scheduled:v('c_sched'),deadline:v('c_dl'),references:v('c_ref'),drive:v('c_drive'),platforms};
  if(id){const c=DB.contents.find(x=>x.id===id);Object.assign(c,d);const np={};platforms.forEach(p=>np[p]=c.published&&c.published[p]||false);c.published=np;save();viewContent(id);}
  else{const pub={};platforms.forEach(p=>pub[p]=false);const by=currentUser.id;const p=proj(d.projectId);
    const sched=d.scheduled||d.deadline,chain=chainForFormat(d.format),jtasks=[];
    chain.forEach((part,idx)=>{if(part==='Joylash'){const list=platforms.length?platforms:[null];list.forEach(pl=>jtasks.push(mkTask('Joylash',assignForPart('Joylash',d,p),by,sched,todayStr(),(p&&p.checklist)||[],pl||undefined)));}
      else{const dl=sched?shiftDate(sched,-(chain.length-1-idx)):d.deadline;jtasks.push(mkTask(part,assignForPart(part,d,p),by,dl,todayStr(),(part==='Montaj'&&p&&p.checklist)||[]));}});
    DB.contents.push({id:uid(),...d,published:pub,tasks:jtasks});logAudit('kontent yaratildi',esc(d.topic)+' ('+jtasks.length+' vazifa)');save();closeModal();pageContent();}
}

function viewTask(tid){

    <div class="relation"><div class="rl">🔗 Qaysi kontent uchun</div><div class="flex sp"><div><b>${esc(c.topic)}</b><div class="muted small">${proj(c.projectId)?.name||''} · ${c.format} · ${c.status}</div></div><button class="btn sm sec" onclick="viewContent('${c.id}')">Kontent →</button></div></div>

      <tr><td>Bajarilishi kerak</td><td>${fmtDate(t.deadline)} ${t.status!=='Tasdiqlandi'&&t.deadline&&t.deadline<todayStr()?'<span class="chip red plain">muddat o‘tdi</span>':''}</td></tr>
      <tr><td>Bajarilgan sana</td><td>${t.doneAt?fmtDate(t.doneAt)+(onTime(t)?' <span class="chip green plain">vaqtida</span>':' <span class="chip red plain">kech</span>'):'—'}</td></tr>
      <tr><td>Ish havolasi</td><td>${t.link?`<a href="${t.link}" target="_blank">havola</a>`:'—'}</td></tr>
    </tbody></table>
    ${t.checklist&&t.checklist.length?`<div class="relation" style="margin-top:14px"><div class="rl">☑ Checklist (${chkDone}/${t.checklist.length})</div>${t.checklist.map((x,i)=>`<label class="check" style="cursor:pointer"><input type="checkbox" ${x.done?'checked':''} ${canSubmit?'':'disabled'} onchange="toggleCheck('${t.id}',${i})"> <span style="${x.done?'text-decoration:line-through;color:var(--muted)':''}">${esc(x.text)}</span></label>`).join('')}</div>`:''}
    ${t.reworkLog&&t.reworkLog.length?`<div class="relation" style="margin-top:14px"><div class="rl">↩ Qaytarish tarixi (${t.reworkLog.length})</div>${t.reworkLog.slice().reverse().map(rl=>`<div style="padding:6px 0;border-bottom:1px solid var(--line)"><div>${esc(rl.reason)||'<span class="muted">sabab yozilmagan</span>'}</div><div class="muted small">${esc(rl.by)} · ${fmtTs(rl.ts)}</div></div>`).join('')}</div>`:''}
    ${taskActions(t,c)}
    ${canManage?`<div class="row" style="margin-top:18px"><button class="btn sec" onclick="editTask('${t.id}')">Tahrirlash</button><button class="btn danger" onclick="delTask('${c.id}','${t.id}');closeModal()">O‘chirish</button></div>`:''}`);
}
function taskActions(t,c){
  const isMine=t.assigneeId===currentUser.id,mgr=currentUser.role==='admin'||currentUser.role==='smm';
  const approver=emp(approverOf(t)),apprName=approver?approver.name:'Admin';
  const canAppr=canApprove(t);
  if(t.status==='Yangi')return (isMine||mgr)?`<div class="relation" style="margin-top:14px"><button class="btn" onclick="acceptTask('${t.id}')">✋ Qabul qildim</button><div class="hint">Qabul qilsangiz — «Jarayonda»ga o‘tadi.</div></div>`:`<div class="hint" style="margin-top:12px">Yangi vazifa — bajaruvchi qabul qilishi kutilmoqda.</div>`;
  if(t.status==='Jarayonda')return (isMine||mgr)?`<div class="relation" style="margin-top:14px"><div class="rl">Ishni topshirish</div><label>Bajarilgan ish havolasi</label><div class="flex"><input id="lnk_${t.id}" placeholder="https://..." value="${esc(t.link)}"><button class="btn" onclick="finishTask('${t.id}')">✓ Tugatdim</button></div><div class="hint">Tugatilgach «Tekshiruvda»ga o‘tadi. Tasdiqlovchi: <b>${apprName}</b>.</div></div>`:`<div class="hint" style="margin-top:12px">Vazifa jarayonda.</div>`;
  if(t.status==='Tekshiruvda')return canAppr?`<div class="relation" style="margin-top:14px"><div class="rl">Tekshiruv — tasdiqlovchi: ${apprName}</div>${t.link?`<div class="small" style="margin-bottom:8px">Ish: <a href="${t.link}" target="_blank">havola</a></div>`:''}<div class="flex" style="gap:8px"><button class="btn" onclick="approveTask('${t.id}')">✓ Tasdiqlayman</button><button class="btn danger" onclick="returnTask('${t.id}')">↩ Qaytarish</button></div></div>`:`<div class="hint" style="margin-top:12px">Tekshiruvda — <b>${apprName}</b> tasdiqlashi kutilmoqda.${isMine?' O‘z vazifangizni o‘zingiz tasdiqlay olmaysiz.':''}</div>`;
  return `<div class="relation" style="margin-top:14px"><span class="chip green">✓ Tasdiqlandi</span> ${(mgr||canAppr)?`<button class="btn ghost sm" onclick="reopenTask('${t.id}')">qayta ochish</button>`:''}</div>`;
}
function toggleCheck(tid,i){const f=findTask(tid);if(!f)return;f.t.checklist[i].done=!f.t.checklist[i].done;save();viewTask(tid);}
function moveTask(tid,ns){const f=findTask(tid);if(!f)return false;const{c,t}=f;const isMine=currentUser.id===t.assigneeId,mgr=currentUser.role==='admin'||currentUser.role==='smm';
  if(ns==='Tasdiqlandi'){if(!canApprove(t)){alert('Tasdiqlashga ruxsat yo‘q. Vazifani bajargan odam o‘zini tasdiqlay olmaydi — tasdiqlovchi «'+((emp(approverOf(t))||{}).name||'Admin')+'» yoki admin.');return false;}}
  else if(!(isMine||mgr)){alert('Bu vazifani o‘zgartirishga ruxsatingiz yo‘q.');return false;}

  if(ns==='Tasdiqlandi'){if(!t.doneAt)t.doneAt=todayStr();if(t.part==='Joylash'){if(t.platform)c.published[t.platform]=true;else c.platforms.forEach(p=>c.published[p]=true);}}

function approveTask(tid){const f=findTask(tid);if(moveTask(tid,'Tasdiqlandi')){if(f)notify(f.t.assigneeId,'✓ Vazifangiz tasdiqlandi: «'+f.t.title+'».');viewTask(tid);refresh();}}
function reopenTask(tid){if(moveTask(tid,'Jarayonda')){viewTask(tid);refresh();}}
function returnTask(tid){const f=findTask(tid);if(!f)return;const{t}=f;if(!canApprove(t)){alert('Qaytarishga ruxsat yo‘q.');return;}
  rejectReason('Vazifani qaytarish sababi',reason=>{t.reworkCount=(t.reworkCount||0)+1;(t.reworkLog=t.reworkLog||[]).push({ts:new Date().toISOString(),by:currentUser.name,reason});if(moveTask(tid,'Jarayonda')){notify(t.assigneeId,'↩ Vazifa qaytarildi: «'+t.title+'». Sabab: '+(reason||'—'));viewTask(tid);refresh();}});}
function dropTask(ev,ns){ev.preventDefault();const tid=ev.dataTransfer.getData('tid');document.querySelectorAll('.kcol').forEach(k=>k.classList.remove('drag'));if(tid&&moveTask(tid,ns))pageTasks();}

/* ============================================================ KPI / OYLIK */
let salFrom=todayStr().slice(0,8)+'01',salTo=todayStr();
function workingDaysInMonth(y,m){const days=new Date(y,m+1,0).getDate();let n=0;for(let d=1;d<=days;d++){if(DB.settings.workDays.includes(new Date(y,m,d).getDay()))n++;}return n||1;}
function workDayFactor(from,to){let f=0,d=new Date(from);const end=new Date(to);let g=0;while(d<=end&&g<400){if(DB.settings.workDays.includes(d.getDay()))f+=1/workingDaysInMonth(d.getFullYear(),d.getMonth());d.setDate(d.getDate()+1);g++;}return f;}
function workDaysInRange(from,to){let n=0,d=new Date(from);const end=new Date(to);let g=0;while(d<=end&&g<400){if(DB.settings.workDays.includes(d.getDay()))n++;d.setDate(d.getDate()+1);g++;}return n;}
function periodKey(from,to){return from+'_'+to;}
function getAdj(eid,key){let a=DB.adjustments.find(x=>x.employeeId===eid&&x.period===key);if(!a){a={id:uid(),employeeId:eid,period:key,pen:{},bon:{},arch:{},customPen:0,customBon:0,note:''};DB.adjustments.push(a);}if(!a.arch)a.arch={};return a;}
function bandMontaj(n){return n<=0?1:n===1?0.4:n===2?0.2:0;}

function autoLateRange(eid,from,to){const recs=DB.attendance.filter(a=>a.employeeId===eid&&a.date>=from&&a.date<=to&&a.in&&a.status==='late');let c1560=0,c60=0;const[wh,wm]=DB.settings.workStart.split(':').map(Number);recs.forEach(r=>{const[ih,im]=r.in.split(':').map(Number);const diff=(ih*60+im)-(wh*60+wm);if(diff>60)c60++;else c1560++;});return {c1560,c60,late1560:Math.max(0,c1560-2),late60_2:c60>=2?1:0,late60_3:Math.max(0,c60-2)};}
function projectKpiDetail(e,p,from,to,adj){
  const w=DB.settings.kpiWeights,max=e.kpiPerProject||0;

const ABSENT_ST=['absent','unpaid'];              // to'lanmaydigan yo'qlik (fiksni kamaytiradi)

function attRec(eid,date){return DB.attendance.find(a=>a.employeeId===eid&&a.date===date);}
function calcSalaryRange(e,from,to){
  const key=periodKey(from,to),adj=DB.adjustments.find(x=>x.employeeId===e.id&&x.period===key)||{};
  const today=todayStr();
  // 1) FIKS — DEFAULT: ish kuni "kelgan" deb hisoblanadi; faqat "yo'q" (absent/unpaid) belgilangan kun kamaytiradi
  let fix=0,presentDays=0,absentDays=0,paidAbsentDays=0,lateDays=0;
  {let d=new Date(from);const end=new Date(to);let g=0;
    while(d<=end&&g<400){const ds=iso(d);
      if(DB.settings.workDays.includes(d.getDay())){
        const r=attRec(e.id,ds);const st=r?r.status:'present';
        if(ABSENT_ST.includes(st)){absentDays++;}                  // to'lanmaydi
        else{fix+=(e.fix||0)/workingDaysInMonth(d.getFullYear(),d.getMonth());presentDays++;
          if(st==='late')lateDays++;if(PAID_ABSENT_ST.includes(st))paidAbsentDays++;}
      }d.setDate(d.getDate()+1);g++;}}
  fix=Math.round(fix);
  const workDays=workDaysInRange(from,to);
  // 2) VAZIFA — bosqichli baho; muddati kelmagan (kelajakdagi, hali bajarilmagan) vazifalar maxrajdan chiqariladi
  const myTasks=DB.contents.flatMap(c=>c.tasks).filter(t=>t.assigneeId===e.id&&t.deadline&&t.deadline>=from&&t.deadline<=to);
  const dueTasks=myTasks.filter(t=>t.status==='Tasdiqlandi'||(t.deadline&&t.deadline<=today)); // due yoki bajarilgan
  let score=0,onTime=0,lateDone=0,notDone=0;
  dueTasks.forEach(t=>{const done=t.status==='Tasdiqlandi';
    if(done&&t.doneAt&&t.doneAt<=t.deadline){score+=1;onTime++;}
    else if(done){score+=0.4;lateDone++;}                          // bajarilgan lekin kech — qisman
    else{notDone++;}});                                            // muddati o'tgan, bajarilmagan — 0
  const totalTasks=dueTasks.length,pendingTasks=myTasks.length-dueTasks.length;
  const taskNA=totalTasks===0;                                     // vazifa berilmagan — hisobga olinmaydi
  const taskFrac=taskNA?0:score/totalTasks,taskPay=taskNA?0:Math.round((e.taskPay||0)*taskFrac);
  // 3) AVTO JARIMA — kechikish/sababsiz yo'qlik (admin hisobot vaqtida bekor qila oladi: adj.penWaive)
  const pen=DB.settings.penalties,li=autoLateRange(e.id,from,to);
  let autoPen=0;const penList=[];
  if(li.late1560>0){autoPen+=li.late1560*(pen.late1560||0);penList.push(li.late1560+'× 15–60 daq kechikish');}
  if(li.late60_2>0){autoPen+=(pen.late60_2||0);penList.push('60+ daq kechikish (2-marta)');}
  if(li.late60_3>0){autoPen+=li.late60_3*(pen.late60_3||0);penList.push(li.late60_3+'× 60+ daq kechikish');}
  if(absentDays>=1){autoPen+=(pen.unexcused1||0);penList.push('sababsiz yo\'qlik (1-kun)');}
  if(absentDays>=2){autoPen+=(absentDays-1)*(pen.unexcused2||0);penList.push((absentDays-1)+'× sababsiz yo\'qlik (qo\'shimcha)');}
  const penWaived=!!adj.penWaive;if(penWaived)autoPen=0;
  // qonuniy chegara: jami ushlash (fiks+vazifa)ning legalCapPct% dan oshmasin
  const capBase=fix+taskPay,cap=Math.round(capBase*(DB.settings.legalCapPct||30)/100);
  const manualPen=(adj.customPen)||0;let deduction=autoPen+manualPen;let capped=false;
  if(cap>0&&deduction>cap){deduction=cap;capped=true;}
  // 4) BONUS — qo'lda
  const tb=DB.settings.bonuses,bon=(adj.bon)||{};
  let bonus=0;const bonList=[];BON_TARIFF.forEach(b=>{if(bon[b.key]){bonus+=tb[b.key]||0;bonList.push(b.label);}});bonus+=(adj.customBon)||0;
  return {id:e.id,name:e.name,fix,taskPay,taskMax:e.taskPay||0,taskPct:Math.round(taskFrac*100),taskNA,
    totalTasks,onTime,lateDone,notDone,doneTasks:onTime+lateDone,pendingTasks,
    bonus,bonList,autoPen,penWaived,penList,manualPen,deduction,capped,note:adj.note||'',
    workDays,presentDays,absentDays,paidAbsentDays,lateDays,total:fix+taskPay+bonus-deduction};
}

      <div class="muted small" style="margin-top:12px">${cs.length} kontent · ${pub} chop etilgan</div></div>`;}).join('')}</div>`;

function viewProject(id){
  const p=proj(id);if(!p)return;const cs=DB.contents.filter(c=>c.projectId===p.id);const canEdit=currentUser.role==='admin';
  const ms=(p.metrics||[]).slice().sort((a,b)=>a.month<b.month?-1:1);const last=ms.slice(-1)[0],prev=ms.slice(-2)[0];
  const grow=(cur,pr)=>pr?(((cur-pr)/pr)*100):null;const gr=last&&prev?{reach:grow(last.reach,prev.reach),subs:grow(last.subs,prev.subs)}:{};
  const gchip=(val,target)=>val==null?'<span class="muted small">—</span>':`<span class="chip ${val>=target?'green':val>=0?'yellow':'red'} plain">${val>=0?'+':''}${val.toFixed(1)}% ${val>=target?'✓':''}</span>`;
  openModal(`<h2>${esc(p.name)} <button class="x" onclick="closeModal()">×</button></h2>
    <div class="muted small">Egasi: ${esc(ownerName(p))}</div>
    <div class="relation"><div class="rl">📈 Joriy holat va o‘sish (maqsad: reach +${p.targets.reach}%, obunachi +${p.targets.subs}%, ER ${p.targets.engagement}%)</div>
      ${last?`<div class="flex" style="gap:12px;flex-wrap:wrap"><div class="metric" style="flex:1"><span class="muted small">Reach</span><span class="mv">${money(last.reach)}</span>${gchip(gr.reach,p.targets.reach)}</div><div class="metric" style="flex:1"><span class="muted small">Obunachi</span><span class="mv">${money(last.subs)}</span>${gchip(gr.subs,p.targets.subs)}</div><div class="metric" style="flex:1"><span class="muted small">Engagement</span><span class="mv">${last.engagement}%</span><span class="chip ${last.engagement>=p.targets.engagement?'green':'yellow'} plain">maqsad ${p.targets.engagement}%</span></div></div>${last.status?`<div class="small" style="margin-top:8px">Holat: <b>${esc(last.status)}</b></div>`:''}`:'<div class="muted small">Hali ko‘rsatkich qayd etilmagan.</div>'}
      ${canEdit?`<button class="btn sm sec" style="margin-top:10px" onclick="addMetric('${p.id}')">+ O‘sish qayd etish</button>`:''}
      ${ms.length>1?`<div class="gridwrap" style="margin-top:10px"><table><thead><tr><th>Oy</th><th>Reach</th><th>Obunachi</th><th>ER</th></tr></thead><tbody>${ms.slice().reverse().map(m=>`<tr><td>${fmtMonth(m.month)}</td><td>${money(m.reach)}</td><td>${money(m.subs)}</td><td>${m.engagement}%</td></tr>`).join('')}</tbody></table></div>`:''}
    </div>
    <table class="kv" style="margin-top:14px"><tbody><tr><td>Jamoa (to‘lov xodim kartochkasida)</td><td>${(p.team||[]).map(id=>{const m=emp(id);return m?`<span class="tag">${m.name} · ${money(m.payPerProject)}+${money(m.kpiPerProject)}</span>`:'';}).filter(Boolean).join('')||'—'}</td></tr><tr><td>Rubrikalar</td><td>${(p.rubrics||[]).map(r=>`<span class="tag">${r}</span>`).join('')||'—'}</td></tr><tr><td>Task checklist</td><td>${(p.checklist||[]).map(r=>`<span class="tag">☑ ${r}</span>`).join('')||'—'}</td></tr><tr><td>Kontent</td><td>${cs.length} ta · ${cs.filter(c=>c.status==='Chop etilgan').length} chop etilgan</td></tr></tbody></table>
    <div class="row" style="margin-top:18px"><button class="btn" onclick="ownerView('${p.id}')">👁 Mehmon ko‘rinishi</button>${canEdit?`<button class="btn sec" onclick="editProj('${p.id}')">Tahrirlash</button><button class="btn danger" onclick="delProj('${p.id}')">O‘chirish</button>`:''}</div>`);
}
function addMetric(pid){const p=proj(pid);
  openModal(`<h2>O‘sish qayd etish <button class="x" onclick="viewProject('${pid}')">×</button></h2><div class="hint">${esc(p.name)}</div>
    <div class="row"><div><label>Oy</label><input type="month" id="m_month" value="${curMonth()}"></div><div><label>Holat</label><input id="m_status" placeholder="Barqaror o‘smoqda"></div></div>
    <div class="row"><div><label>Reach</label><input type="number" id="m_reach" value="0"></div><div><label>Obunachilar</label><input type="number" id="m_subs" value="0"></div><div><label>ER %</label><input type="number" step="0.1" id="m_eng" value="0"></div></div>
    <div class="row" style="margin-top:16px"><button class="btn" onclick="saveMetric('${pid}')">Saqlash</button><button class="btn sec" onclick="viewProject('${pid}')">Bekor</button></div>`);}
function saveMetric(pid){const p=proj(pid);const month=v('m_month');const ex=p.metrics.find(m=>m.month===month);const d={reach:+v('m_reach')||0,subs:+v('m_subs')||0,engagement:+v('m_eng')||0,status:v('m_status')};if(ex)Object.assign(ex,d);else p.metrics.push({id:uid(),month,...d});save();viewProject(pid);}
function editProj(id){const p=id?proj(id):null;
  openModal(`<h2>${p?'Loyiha':'Yangi loyiha'} <button class="x" onclick="${p?`viewProject('${id}')`:'closeModal()'}">×</button></h2>
    <div class="row"><div><label>Loyiha nomi</label><input id="p_name" value="${p?esc(p.name):''}"></div><div><label>Loyiha egasi (mijoz)</label><select id="p_ownerId">${clientOptions(p?p.ownerId:'')}</select></div></div>

    <label>Jamoa (kim ishlaydi va to‘lov oladi)</label><div class="switch">${DB.employees.filter(e=>e.role==='mobilograf'||e.role==='smm').map(e=>`<label><input type="checkbox" class="p_team" value="${e.id}" ${p&&(p.team||[]).includes(e.id)?'checked':''}> ${e.name}</label>`).join('')}</div>
    <div class="row"><div><label>Maqsad Reach %</label><input id="p_tr" type="number" value="${p?p.targets.reach:15}"></div><div><label>Obunachi %</label><input id="p_ts" type="number" value="${p?p.targets.subs:5}"></div><div><label>ER %</label><input id="p_te" type="number" step="0.1" value="${p?p.targets.engagement:3}"></div></div>

    <div class="row" style="margin-top:16px"><button class="btn" onclick="saveProj('${id||''}')">Saqlash</button><button class="btn sec" onclick="${p?`viewProject('${id}')`:'closeModal()'}">Bekor</button></div>`);}
function clientOptions(sel){const cs=DB.employees.filter(e=>e.role==='owner');if(!cs.length)return '<option value="">(avval «Mijoz» yarating)</option>';return '<option value="">— tanlanmagan —</option>'+cs.map(c=>`<option value="${c.id}" ${sel===c.id?'selected':''}>${c.name}</option>`).join('');}
function saveProj(id){const team=[...document.querySelectorAll('.p_team:checked')].map(x=>x.value);const rubrics=v('p_rub').split(',').map(s=>s.trim()).filter(Boolean);const checklist=v('p_chk').split(',').map(s=>s.trim()).filter(Boolean);const ownerId=v('p_ownerId');const d={name:v('p_name'),ownerId,owner:ownerId?(emp(ownerId)?emp(ownerId).name:''):'',team,rubrics,checklist,targets:{reach:+v('p_tr')||0,subs:+v('p_ts')||0,engagement:+v('p_te')||0}};if(id){Object.assign(proj(id),d);save();viewProject(id);}else{DB.projects.push({id:uid(),...d,metrics:[]});save();closeModal();pageProjects();}}
function delProj(id){if(!confirm('O‘chirilsinmi?'))return;DB.projects=DB.projects.filter(p=>p.id!==id);save();closeModal();pageProjects();}

  <div class="panel gridwrap"><h2>Kontent reja va g‘oyalar</h2><table><thead><tr><th>Mavzu</th><th>Rubrika</th><th>Holat</th><th style="width:150px">Progress</th><th>Chop sana</th><th>Sizning tasdig‘ingiz</th></tr></thead><tbody>${cs.map(c=>{const pr=contentProgress(c),ca=c.clientApproval;

      :ca==='rejected'?`<span class="chip red plain">✗ rad etdingiz</span>${c.clientApprovalNote?` <span class="muted small">${esc(c.clientApprovalNote)}</span>`:''}`
      :`<button class="btn sm" onclick="clientApprove('${c.id}')">✓ Tasdiqlash</button> <button class="btn sm danger" onclick="clientReject('${c.id}')">✗ Rad</button>`;
    return `<tr><td><b>${esc(c.topic)}</b>${c.ideaBy?' <span class="chip purple plain">mening g‘oyam</span>':''}${c.goal?`<div class="muted small">${esc(c.goal)}</div>`:''}</td><td>${esc(c.rubric)}</td><td><span class="chip ${STC[c.status]}">${c.status}</span></td><td><div class="flex nowrap" style="gap:8px"><div class="prog" style="flex:1"><i class="${pr===100?'full':''}" style="width:${pr}%"></i></div><span class="small muted">${pr}%</span></div></td><td>${fmtDate(c.scheduled)}</td><td>${app}</td></tr>`;}).join('')||'<tr><td colspan="6" class="muted">Hali kontent yo‘q. «💡 G‘oya qo‘shish» orqali taklif kiriting.</td></tr>'}</tbody></table>

function clientApprove(cid){const c=DB.contents.find(x=>x.id===cid);if(!c)return;c.clientApproval='approved';c.clientApprovalNote='';logAudit('mijoz tasdiqladi',esc(c.topic));notify(c.responsibleId,'✅ Mijoz «'+c.topic+'» kontentini tasdiqladi.');save();ownerView(c.projectId);}
function clientReject(cid){const c=DB.contents.find(x=>x.id===cid);if(!c)return;rejectReason('Kontentni rad etish sababi',reason=>{c.clientApproval='rejected';c.clientApprovalNote=reason;logAudit('mijoz rad etdi',esc(c.topic));notify(c.responsibleId,'❌ Mijoz «'+c.topic+'» kontentini rad etdi. Sabab: '+(reason||'—'));save();ownerView(c.projectId);});}

  <div class="panel"><h2>Ish vaqti va jadval</h2><div class="row"><div><label>Ish boshlanishi</label><input type="time" value="${s.workStart}" onchange="setS('workStart',this.value)"></div><div><label>Kechikish ruxsati (daq)</label><input type="number" value="${s.lateThreshold}" onchange="setS('lateThreshold',+this.value)"></div><div><label>Jarima chegara (%)</label><input type="number" value="${s.legalCapPct}" onchange="setS('legalCapPct',+this.value)"></div></div>
    <label>Ish kunlari</label><div class="switch">${WEEKDAYS.map(w=>`<label><input type="checkbox" ${s.workDays.includes(w.d)?'checked':''} onchange="toggleWD(${w.d})"> ${w.l}</label>`).join('')}</div></div>
  <div class="panel"><h2>💵 Jarima tariflari (so'm)</h2>${PEN_TARIFF.map(r=>`<div class="tarif-row"><span class="lb">${r.label} ${r.note?`<span class="muted small">— ${r.note}</span>`:''}</span><input type="number" value="${s.penalties[r.key]}" onchange="setPen('${r.key}',+this.value)"></div>`).join('')}</div>
  <div class="panel"><h2>🎁 Bonus tariflari (so'm)</h2>${BON_TARIFF.map(b=>`<div class="tarif-row"><span class="lb">${b.label} ${b.note?`<span class="muted small">— ${b.note}</span>`:''}</span><input type="number" value="${s.bonuses[b.key]}" onchange="setBon('${b.key}',+this.value)"></div>`).join('')}</div>
  <div class="panel"><h2>KPI vaznlari (%) <span class="chip ${kwSum===100?'green':'yellow'} plain">jami ${kwSum}%</span></h2>${KPI_CRIT.map(c=>`<div class="tarif-row"><span class="lb">${c.label} <span class="muted small">— ${c.desc}</span></span><input type="number" value="${kw[c.key]||0}" onchange="setKW('${c.key}',+this.value)" style="width:90px"></div>`).join('')}</div>
  <div class="panel"><h2>Formatlar</h2><div class="flex" style="flex-wrap:wrap;gap:6px;margin-bottom:8px">${s.formats.map((r,i)=>`<span class="chip purple">${r} <a onclick="delFmt(${i})" style="cursor:pointer">×</a></span>`).join('')}</div><div class="flex"><input id="new_fmt" placeholder="Yangi format"><button class="btn sm" onclick="addFmt()">+</button></div><div class="hint">Rubrikalar har loyihada alohida (Loyihalar menyusi).</div></div>
  <div class="panel"><h2 class="flex sp">🧾 Audit jurnali <span class="chip gray plain">${(DB.audit||[]).length} yozuv</span></h2>
    <div class="hint" style="margin:0 0 10px">Oylik, davomat va boshqa muhim o‘zgarishlar — kim, qachon.</div>
    <div class="gridwrap" style="max-height:300px;overflow:auto"><table><thead><tr><th>Vaqt</th><th>Kim</th><th>Amal</th><th>Nima</th></tr></thead><tbody>
    ${(DB.audit||[]).slice(-60).reverse().map(a=>`<tr><td class="muted small">${fmtTs(a.ts)}</td><td>${esc(a.by)}</td><td>${esc(a.action)}</td><td class="muted small">${esc(a.target)}</td></tr>`).join('')||'<tr><td colspan="4" class="muted small">Hali yozuv yo‘q.</td></tr>'}
    </tbody></table></div></div>
  <div class="panel"><h2>Ma'lumotlar</h2><div class="notice">${CLOUD?'☁️ Google Sheets ulangan — ma\'lumot bulutda, hamma qurilmada bir xil.':'⚠️ Local rejim (bu qurilmada). Umumiy baza uchun JOYLASH_YORIQNOMASI.md dagi Google Sheets bo‘limi.'}</div>
    <div class="row"><button class="btn" onclick="exportData()">⬇️ Export (JSON)</button><button class="btn sec" onclick="document.getElementById('imp').click()">⬆️ Import</button><button class="btn danger" onclick="resetData()">Tozalash</button></div><input type="file" id="imp" accept=".json" style="display:none" onchange="importData(this)"></div>`);
}
function togglePerm(role,pg,on){const arr=DB.settings.permissions[role]||(DB.settings.permissions[role]=[]);const i=arr.indexOf(pg);if(on&&i<0)arr.push(pg);if(!on&&i>=0)arr.splice(i,1);logAudit('huquq o‘zgardi',ROLES[role]+' · '+PAGE_LABELS[pg]+' · '+(on?'ochildi':'yopildi'));save();}
function toggleScope(role,on){DB.settings.scopeOwn=DB.settings.scopeOwn||{};DB.settings.scopeOwn[role]=on;save();}
function setS(k,val){DB.settings[k]=val;save();}
function setPen(k,val){DB.settings.penalties[k]=val;save();}
function setBon(k,val){DB.settings.bonuses[k]=val;save();}
function setKW(k,val){DB.settings.kpiWeights[k]=val;save();pageSettings();}
function toggleWD(d){const wd=DB.settings.workDays;const i=wd.indexOf(d);if(i>=0)wd.splice(i,1);else wd.push(d);save();pageSettings();}
function addFmt(){const val=document.getElementById('new_fmt').value.trim();if(val){DB.settings.formats.push(val);save();pageSettings();}}
function delFmt(i){DB.settings.formats.splice(i,1);save();pageSettings();}
function exportData(){const b=new Blob([JSON.stringify(DB,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='smm_erp_backup_'+todayStr()+'.json';a.click();}
function importData(inp){const f=inp.files[0];if(!f)return;const rd=new FileReader();rd.onload=()=>{try{const d=JSON.parse(rd.result);if(validDB(d)){DB=d;migrate();save();alert('Import muvaffaqiyatli!');go('dash');}else alert('Fayl noto‘g‘ri yoki to‘liq emas.');}catch(e){alert('Xato: '+e.message);}};rd.readAsText(f);}
function resetData(){if(confirm('BARCHA ma‘lumot o‘chiriladi. Ishonchingiz komilmi?')){if(CLOUD){DB=seed();save();}else localStorage.removeItem(LS_KEY);location.reload();}}

/* ============================================================ LOGIN */
function renderLogin(){
  document.getElementById('side').style.display='none';document.querySelector('.mobtop').style.display='none';
  document.getElementById('view').outerHTML='<main class="main" id="view"></main>'; // reset
  document.getElementById('view').innerHTML=`<div class="login-wrap"><div class="login-card">
    <div class="flex" style="gap:10px;margin-bottom:6px"><span class="logo" style="width:34px;height:34px;font-size:16px">S</span><div><div style="font-weight:700;font-size:18px">SMM ERP</div><div class="muted small">Tizimga kirish</div></div></div>
    <label>Login</label><input id="lg_login" placeholder="masalan: bek" autocomplete="username">
    <label>PIN</label><input id="lg_pin" type="password" placeholder="••••" autocomplete="current-password" onkeydown="if(event.key==='Enter')doLogin()">
    <div id="lg_err" class="chip red" style="display:none;margin-top:12px;width:100%">Login yoki PIN xato</div>
    <button class="btn block" style="margin-top:16px" onclick="doLogin()">Kirish</button>
  </div></div>`;
}
function doLogin(){
  const login=(document.getElementById('lg_login').value||'').trim().toLowerCase();
  const pin=(document.getElementById('lg_pin').value||'').trim();
  const u=DB.employees.find(e=>(e.login||'').toLowerCase()===login&&String(e.pin)===pin&&e.active!==false);
  if(!u){document.getElementById('lg_err').style.display='block';return;}
  setSession(u.id);currentUser=u;startApp();
}
function startApp(){
  const side=document.getElementById('side');
  if(currentUser.role==='owner'){side.style.display='none';document.querySelector('.mobtop').style.display='none';ownerHome();return;}
  side.style.display='';
  if(window.innerWidth<=860)document.querySelector('.mobtop').style.display='flex';else document.querySelector('.mobtop').style.display='';
  renderNav();go(firstPage());
}
function ownerHome(){
  const mine=DB.projects.filter(p=>p.ownerId===currentUser.id);
  if(mine.length===1){ownerView(mine[0].id);}
  else if(mine.length>1){view(`<div class="topbar no-print"><h1>Loyihalarim</h1><button class="btn sec" onclick="logout()">Chiqish</button></div>
    <div class="grid cards">${mine.map(p=>{const m=(p.metrics||[]).slice(-1)[0];const cs=DB.contents.filter(c=>c.projectId===p.id);return `<div class="card click" onclick="ownerView('${p.id}')"><b style="font-size:16px">${esc(p.name)}</b><div class="muted small" style="margin-top:6px">${m?('Reach '+money(m.reach)+' · Obunachi '+money(m.subs)):'ko‘rsatkich yo‘q'}</div><div class="muted small" style="margin-top:6px">${cs.length} kontent</div></div>`;}).join('')}</div>`);}
  else{view(`<div class="topbar no-print"><h1>Salom, ${esc(currentUser.name)}</h1><button class="btn sec" onclick="logout()">Chiqish</button></div><div class="panel"><div class="muted">Sizga hali loyiha biriktirilmagan. Administrator <b>Loyihalar</b> bo‘limida «Loyiha egasi» maydonidan sizni tanlashi kerak.</div></div>`);}
}
function routeAuth(){const id=sessionId();const u=id?DB.employees.find(e=>e.id===id&&e.active!==false):null;if(u){currentUser=u;startApp();}else{renderLogin();}}

/* ---------- Init ---------- */
(async function boot(){
  await pull();subscribeRealtime();routeAuth();
})();
</script>
</body>
</html>
